name: Version Update and Upload Python Package

# Disabled attestations to correct errors on upload.
# https://github.com/pypa/gh-action-pypi-publish/issues/283

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or SHA to build/test (default: event ref)'
        required: false
        default: ''
      release_version:
        description: 'Version to use when manually testing (omit to use current package version)'
        required: false
        default: ''
      publish_to_pypi:
        description: 'Publish to PyPI (only for manual runs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.set_version.outputs.release_version }}
      base_version: ${{ steps.set_version.outputs.base_version }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        # Use provided ref for manual run, else use the event ref
        ref: ${{ inputs.target_ref || github.ref }}

    - name: Determine release/base versions
      id: set_version
      run: |
        RAW_TAG_NAME="${{ github.event.release.tag_name || '' }}"
        if [ -z "$RAW_TAG_NAME" ]; then
          RAW_TAG_NAME="${GITHUB_REF##refs/tags/}"
        fi
        CURRENT_TAG_VERSION="${RAW_TAG_NAME#v}"
        INPUT_VERSION="${{ inputs.release_version }}"
        if [ "${{ github.event_name }}" = "release" ]; then
          USE_VERSION="$CURRENT_TAG_VERSION"
        elif [ -n "$INPUT_VERSION" ]; then
          USE_VERSION="$INPUT_VERSION"
        else
          USE_VERSION=$(python -c 'from utils.release import get_version; print(get_version())')
        fi
        echo "release_version=$USE_VERSION" >> $GITHUB_ENV
        echo "base_version=$(python -c 'from utils.release import get_version; print(get_version())')" >> $GITHUB_ENV
        echo "release_version=$USE_VERSION" >> $GITHUB_OUTPUT
        echo "base_version=$(python -c 'from utils.release import get_version; print(get_version())')" >> $GITHUB_OUTPUT

    - name: Update version (idempotent)
      if: github.event_name == 'release' || inputs.publish_to_pypi == 'true'
      run: |
        RELEASE_VERSION="${{ steps.set_version.outputs.release_version }}"
        BASE_VERSION="${{ steps.set_version.outputs.base_version }}"

        # Guard: ensure release_version is set; if not, skip to avoid calling release.py with empty arg
        if [ -z "$RELEASE_VERSION" ]; then
          echo "release_version is empty; skipping version update.";
          exit 0
        fi

        if [ "$RELEASE_VERSION" = "$BASE_VERSION" ]; then
          echo "Version already $RELEASE_VERSION; skipping bump.";
        else
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          python utils/release.py --update_version "$RELEASE_VERSION"
          if git diff --quiet; then
            echo "No changes after version update.";
          else
            git add .
            git commit -m "Update version from $BASE_VERSION to $RELEASE_VERSION"
            # Only push to master/default branch on release event (assuming main)
            if [ "${{ github.event_name }}" = "release" ]; then
              git pull --rebase origin main
              git push origin HEAD:refs/heads/main
            fi
          fi
        fi
        
  release-build:
    name: Build / Test / Publish
    runs-on: ubuntu-22.04
    needs: update-version
    
    environment:
      name: pypi-release
      url: https://pypi.org/p/anime_seg

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools twine build
          pip install -U torch --index-url https://download.pytorch.org/whl/cpu
          pip install -U transformers safetensors peft huggingface_hub numpy Pillow

      - name: Clean old build metadata
        run: |
          rm -rf dist build
          rm -rf src/*.egg-info

      - name: Sync package version for build
        run: |
          TARGET_VERSION="${{ needs.update-version.outputs.release_version }}"
          if [ -z "$TARGET_VERSION" ]; then
            echo "release_version is empty; aborting to avoid publishing wrong version."
            exit 1
          fi
          python utils/release.py --update_version "$TARGET_VERSION"
          echo "Version synchronized to $TARGET_VERSION"
          grep -E '^__version__' src/anime_seg/__init__.py
          grep -E '^\s*version\s*=' setup.py

      - name: Verify version matches release tag
        run: |
          TAG_VERSION="${{ needs.update-version.outputs.release_version }}"
          INIT_VERSION=$(python -c "import re, pathlib; t=pathlib.Path('src/anime_seg/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\']([^\"\']+)[\"\']', t).group(1))")
          SETUP_VERSION=$(python -c "import re, pathlib; t=pathlib.Path('setup.py').read_text(encoding='utf-8'); print(re.search(r'version\\s*=\\s*[\"\']([^\"\']+)[\"\']', t).group(1))")
          echo "tag=$TAG_VERSION init=$INIT_VERSION setup=$SETUP_VERSION"
          test "$TAG_VERSION" = "$INIT_VERSION"
          test "$TAG_VERSION" = "$SETUP_VERSION"

      - name: Build distributions
        run: |
          python -m build
          ls -l dist

      - name: Verify built artifact version
        run: |
          TAG_VERSION="${{ needs.update-version.outputs.release_version }}"
          python - <<'PY'
          import glob
          import re
          import sys

          tag = "${{ needs.update-version.outputs.release_version }}"
          files = glob.glob("dist/*")
          if not files:
              print("No artifacts found in dist/")
              sys.exit(1)

          for path in files:
              name = path.split("/")[-1]
              m = re.search(r"anime_seg-([0-9][A-Za-z0-9._+-]*)", name)
              if not m:
                  print(f"Could not parse version from artifact: {name}")
                  sys.exit(1)
              version = m.group(1)
              print(f"artifact={name} parsed_version={version}")
              if version != tag:
                  print(f"Version mismatch: expected {tag}, got {version}")
                  sys.exit(1)
          PY

      - name: Publish to Test PyPI
        if: github.event_name == 'release' || inputs.publish_to_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          attestations: false
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Test install from built artifacts (wheel)
        run: |
          python -c "import glob,sys; print('dist:',glob.glob('dist/*'))" || true
          pip install --no-cache-dir dist/*.whl
          python -c "from anime_seg import *" 

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          attestations: false
          skip-existing: false
