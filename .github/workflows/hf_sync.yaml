name: Sync GitHub Assets to Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev5
    paths:
      - README.md

permissions:
  contents: read

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    environment:
      name: hf_push

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: suzukimain/AnimeSeg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Upload README
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          repo_id = os.environ.get("HF_REPO_ID", "")
          if not token:
              raise RuntimeError("HF_TOKEN is not set")
          if not repo_id:
              raise RuntimeError("HF_REPO_ID is not set")

          api = HfApi(token=token)
            api.upload_file(
              path_or_fileobj="README.md",
              path_in_repo="README.md",
              repo_id=repo_id,
              repo_type="model",
              commit_message="chore: sync README.md from GitHub",
            )
            print("uploaded: README.md")
          PY

      - name: Summary
        run: |
          echo "## Hugging Face Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repo: $HF_REPO_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synced: README.md" >> "$GITHUB_STEP_SUMMARY"
